name: Daily watering text

on:
  schedule:
    # 12:00 UTC = 8am EDT / 7am EST. GitHub runs cron in UTC only.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      today:
        description: 'Pretend today is this date (YYYY-MM-DD)'
        required: false
      dry_run:
        description: 'Print the message without sending it'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watering-notification
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Work out who needs water, and text me
        env:
          # Twilio (route 1) — set all four to use it
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          # Email-to-SMS gateway (route 2, free) — set all four to use it
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMS_TO_EMAIL: ${{ secrets.SMS_TO_EMAIL }}
        run: |
          python scripts/notify.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.today && format('--today {0}', inputs.today) || '' }}

      - name: Record the run
        # Committing the run state doubles as repo activity, which stops GitHub
        # from auto-disabling this schedule after 60 quiet days.
        if: ${{ always() && github.event_name == 'schedule' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/notify-state.json)" ]; then
            git add data/notify-state.json
            git commit -m "Record watering notification run [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          else
            echo "Nothing to record."
          fi
